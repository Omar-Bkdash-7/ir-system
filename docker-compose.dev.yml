# =============================================================================
# Docker Compose - Development Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

# Override named volumes with empty definitions to use bind mounts instead
volumes:
  datasets: null
  indices: null
  cache: null
  processed_data: null
  evaluation_results: null
  logs: null
  metadata: null

services:

  # ---------------------------------------------------------------------------
  # Development overrides for all services
  # ---------------------------------------------------------------------------

  api_gateway:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: runtime
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api_gateway:/app/services/api_gateway
      - ./common:/app/common
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data/datasets:/app/data/datasets
      - ./data/indices:/app/data/indices
      - ./data/cache:/app/data/cache
      - ./data/processed:/app/data/processed
      - ./data/evaluation:/app/data/evaluation
      - ./data/metadata:/app/data/metadata
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"
      IR_DATASETS_HOME: /app/data/datasets/.ir_datasets

  preprocessing:
    build:
      context: .
      dockerfile: docker/service-nlp.Dockerfile
      target: runtime
    command: python -m uvicorn services.preprocessing.api.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/preprocessing:/app/services/preprocessing
      - ./common:/app/common
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data/datasets:/app/data/datasets
      - ./data/indices:/app/data/indices
      - ./data/cache:/app/data/cache
      - ./data/processed:/app/data/processed
      - ./data/evaluation:/app/data/evaluation
      - ./data/metadata:/app/data/metadata
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"
      IR_DATASETS_HOME: /app/data/datasets/.ir_datasets

  indexing:
