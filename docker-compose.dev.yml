# =============================================================================
# Docker Compose - Development Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

version: '3.9'

services:

  # ---------------------------------------------------------------------------
  # Development overrides for all services
  # ---------------------------------------------------------------------------
  
  api_gateway:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: runtime
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api_gateway:/app/services/api_gateway:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  preprocessing:
    build:
      context: .
      dockerfile: docker/service-nlp.Dockerfile
      target: runtime
    command: python -m uvicorn services.preprocessing.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/preprocessing:/app/services/preprocessing:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  indexing:
