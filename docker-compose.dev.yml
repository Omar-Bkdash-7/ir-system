      LOG_LEVEL: DEBUG
      RELOAD: "true"

  query_refinement:
    build:
      context: .
      dockerfile: docker/service-nlp.Dockerfile
      target: runtime
    command: python -m uvicorn services.query_refinement.main:app --host 0.0.0.0 --port 8005 --reload
    volumes:
      - ./services/query_refinement:/app/services/query_refinement:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  evaluation:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
      target: runtime
    command: python -m uvicorn services.evaluation.main:app --host 0.0.0.0 --port 8006 --reload
    volumes:
      - ./services/evaluation:/app/services/evaluation:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
    command: streamlit run frontend/app.py --server.fileWatcherType=poll
    volumes:
      - ./frontend:/app/frontend:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
