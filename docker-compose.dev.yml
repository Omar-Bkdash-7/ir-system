      context: .
      dockerfile: docker/ml.Dockerfile
      target: runtime
    command: python -m uvicorn services.indexing.main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./services/indexing:/app/services/indexing:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  retrieval:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
      target: runtime
    command: python -m uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ./services/retrieval:/app/services/retrieval:ro
      - ./common:/app/common:ro
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      RELOAD: "true"

  ranking:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
      target: runtime
    command: python -m uvicorn services.ranking.main:app --host 0.0.0.0 --port 8004 --reload
    volumes:
      - ./services/ranking:/app/services/ranking:ro
