  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
    command: streamlit run frontend/app.py --server.port=8501 --server.fileWatcherType=poll --server.runOnSave=true
    volumes:
      - ./frontend:/app/frontend
