# =============================================================================
# Docker Compose - Development Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This file only overrides what is different in development:
#   - bind mounts replace the named volumes, so editing code needs no rebuild
#   - commands add --reload (uvicorn) / --server.runOnSave (Streamlit)
#   - ENVIRONMENT=development and DEBUG logging
#
# Build targets, healthchecks, dependencies, ports and resource limits are NOT
# repeated here: docker-compose.yml defines them once per service tier and this
# file inherits them. Each service body below is one anchor merge plus its own
# command, so a mount set is written once instead of ten times.
# =============================================================================

# Named volumes are disabled so the bind mounts below take their place.
volumes:
  datasets: null
  indices: null
  cache: null
  processed_data: null
  evaluation_results: null
  logs: null
  metadata: null

# Environment every FastAPI service runs with in development.
x-dev-environment: &dev-environment
  ENVIRONMENT: development
  DEBUG: "true"
  LOG_LEVEL: DEBUG
  RELOAD: "true"
  IR_DATASETS_HOME: /app/data/datasets/.ir_datasets

# Bind mounts of the services that read only code, config and the shared data dirs.
x-dev-volumes-minimal: &dev-volumes-minimal
  - ./services:/app/services
  - ./common:/app/common
  - ./configs:/app/configs
  - ./logs:/app/logs
  - ./data/datasets:/app/data/datasets
  - ./data/indices:/app/data/indices
  - ./data/cache:/app/data/cache
  - ./data/processed:/app/data/processed
  - ./data/evaluation:/app/data/evaluation
  - ./data/metadata:/app/data/metadata

# The same, plus the test tree (services that run the suite inside the container).
x-dev-volumes-with-tests: &dev-volumes-with-tests
  - ./services:/app/services
  - ./common:/app/common
  - ./configs:/app/configs
  - ./tests:/app/tests
  - ./logs:/app/logs
  - ./data/datasets:/app/data/datasets
  - ./data/indices:/app/data/indices
  - ./data/cache:/app/data/cache
  - ./data/processed:/app/data/processed
  - ./data/evaluation:/app/data/evaluation
  - ./data/metadata:/app/data/metadata

# ML services: they also own the model cache and the CLUSTERS output directory.
x-dev-volumes-ml: &dev-volumes-ml
  - ./services:/app/services
  - ./common:/app/common
  - ./configs:/app/configs
  - ./tests:/app/tests
  - ./logs:/app/logs
  - ./data/datasets:/app/data/datasets
  - ./data/indices:/app/data/indices
  - ./data/cache:/app/data/cache
  - ./data/models:/app/data/models
  - ./data/processed:/app/data/processed
  - ./data/evaluation:/app/data/evaluation
  - ./data/metadata:/app/data/metadata
  - ./data/clusters:/app/data/clusters

# Same mounts as the ML group, in the order this service has always declared them
# (compose hashes the list, and an equal hash means `up` leaves the container alone).
x-dev-volumes-evaluation: &dev-volumes-evaluation
  - ./services:/app/services
  - ./tests:/app/tests
  - ./common:/app/common
  - ./configs:/app/configs
  - ./logs:/app/logs
  - ./data/datasets:/app/data/datasets
  - ./data/indices:/app/data/indices
  - ./data/cache:/app/data/cache
  - ./data/models:/app/data/models
  - ./data/processed:/app/data/processed
  - ./data/evaluation:/app/data/evaluation
  - ./data/metadata:/app/data/metadata
  - ./data/clusters:/app/data/clusters

# The two services that also import frontend code, and run pytest with the repo config.
x-dev-volumes-with-frontend: &dev-volumes-with-frontend
  - ./services:/app/services
  - ./frontend:/app/frontend
  - ./tests:/app/tests
  - ./pytest.ini:/app/pytest.ini
  - ./common:/app/common
  - ./configs:/app/configs
  - ./logs:/app/logs
  - ./data/datasets:/app/data/datasets
  - ./data/indices:/app/data/indices
  - ./data/cache:/app/data/cache
  - ./data/models:/app/data/models
  - ./data/processed:/app/data/processed
  - ./data/evaluation:/app/data/evaluation
  - ./data/metadata:/app/data/metadata
  - ./data/clusters:/app/data/clusters

services:

  # ---------------------------------------------------------------------------
  # Entry point
  # ---------------------------------------------------------------------------

  api_gateway:
    volumes: *dev-volumes-minimal
    environment: *dev-environment
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------

  preprocessing:
    volumes: *dev-volumes-with-tests
    environment: *dev-environment
    command: python -m uvicorn services.preprocessing.api.main:app --host 0.0.0.0 --port 8001 --reload

  indexing:
    volumes: *dev-volumes-ml
    environment: *dev-environment
    command: python -m uvicorn services.indexing.main:app --host 0.0.0.0 --port 8002 --reload

  retrieval:
    volumes: *dev-volumes-ml
    environment: *dev-environment
    command: python -m uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8003 --reload

  ranking:
    volumes: *dev-volumes-ml
    environment: *dev-environment
    command: python -m uvicorn services.ranking.main:app --host 0.0.0.0 --port 8004 --reload

  query_refinement:
    volumes: *dev-volumes-with-frontend
    environment: *dev-environment
    command: python -m uvicorn services.query_refinement.main:app --host 0.0.0.0 --port 8005 --reload

  evaluation:
    volumes: *dev-volumes-evaluation
    environment: *dev-environment
    command: python -m uvicorn services.evaluation.main:app --host 0.0.0.0 --port 8006 --reload

  clustering:
    volumes: *dev-volumes-with-frontend
    environment: *dev-environment
    command: python -m uvicorn services.clustering.main:app --host 0.0.0.0 --port 8007 --reload

  # ---------------------------------------------------------------------------
  # RAG and frontend: their own mount sets
  # ---------------------------------------------------------------------------

  rag:
    # data/models/rag holds the local generation model, mounted at the image's /models/rag
    volumes:
      - ./services:/app/services
      - ./common:/app/common
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data/datasets:/app/data/datasets
      - ./data/indices:/app/data/indices
      - ./data/cache:/app/data/cache
      - ./data/models:/app/data/models
      - ./data/models/rag:/models/rag
      - ./data/processed:/app/data/processed
      - ./data/evaluation:/app/data/evaluation
      - ./data/metadata:/app/data/metadata
    environment:
      <<: *dev-environment
      RAG_ENABLE_DIAGNOSTICS: "true"
    command: python -m uvicorn services.rag.main:app --host 0.0.0.0 --port 8008 --reload --reload-dir /app/services --reload-dir /app/common

  frontend:
    volumes:
      - ./services:/app/services
      - ./frontend:/app/frontend
      - ./common:/app/common
      - ./configs:/app/configs
      - ./.streamlit:/app/.streamlit
      - ./logs:/app/logs
      - ./data/datasets:/app/data/datasets
      - ./data/indices:/app/data/indices
      - ./data/cache:/app/data/cache
      - ./data/models:/app/data/models
      - ./data/processed:/app/data/processed
      - ./data/evaluation:/app/data/evaluation
      - ./data/metadata:/app/data/metadata
      - ./data/clusters:/app/data/clusters
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      IR_DATASETS_HOME: /app/data/datasets/.ir_datasets
    command: streamlit run frontend/app.py --server.port=8501 --server.fileWatcherType=poll --server.runOnSave=true
