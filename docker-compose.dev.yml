      context: .
      dockerfile: docker/ml.Dockerfile
      target: runtime
    command: python -m uvicorn services.indexing.main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./services/indexing:/app/services/indexing
      - ./common:/app/common
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data/datasets:/app/data/datasets
      - ./data/indices:/app/data/indices
      - ./data/cache:/app/data/cache
      - ./data/models:/app/data/models
      - ./data/processed:/app/data/processed
      - ./data/evaluation:/app/data/evaluation
