[theme]
base = "dark"
primaryColor = "#a6e3a1"
backgroundColor = "#1e1e2e"
secondaryBackgroundColor = "#313244"
textColor = "#cdd6f4"
font = "sans serif"

[server]
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "poll"
runOnSave = true
allowRunOnSave = true

[runner]
fastReruns = true
enforceSerializableSessionState = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[ui]
hideTopBar = true

[client]
showSidebarNavigation = false
