name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The suite imports the real service modules, so it runs inside the same images
      # used locally instead of a hand-written dependency list that would drift from
      # docker/unified.Dockerfile. The gha cache keeps a warm rebuild to a few minutes.
      - name: Build the ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/unified.Dockerfile
          target: runtime-ml
          load: true
          tags: ir-ml:ci
          cache-from: type=gha,scope=ir-ml
          cache-to: type=gha,mode=max,scope=ir-ml

      # tests/integration needs the running stack; the contract job below owns it.
      # pytest comes from requirements/10-dev.txt inside the image, so no install step.
      - name: Backend suite
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/repo" -w /repo --entrypoint /bin/bash ir-ml:ci -c '
              python -m pytest tests -q --ignore=tests/integration'

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/unified.Dockerfile
          target: runtime-frontend
          load: true
          tags: ir-frontend:ci
          cache-from: type=gha,scope=ir-frontend
          cache-to: type=gha,mode=max,scope=ir-frontend

      - name: Frontend suite
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/repo" -w /repo --entrypoint /bin/bash ir-frontend:ci -c '
              python -m pytest tests/frontend -q'

  # The unit suites fake their neighbours, so they cannot notice a service changing
  # a field name or a status code. This job runs the real services together.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the images the stack needs
        run: |
          for target in light nlp ml; do
            docker buildx build --load -f docker/unified.Dockerfile \
              --target "runtime-$target" -t "ir-$target:ci" \
              --cache-from "type=gha,scope=ir-$target" \
              --cache-to "type=gha,mode=max,scope=ir-$target" .
          done

      - name: Start the stack
        env:
          IR_LIGHT_IMAGE: ir-light:ci
          IR_NLP_IMAGE: ir-nlp:ci
          IR_ML_IMAGE: ir-ml:ci
        run: >-
          docker compose -f docker-compose.ci.yml up -d --wait
          postgres preprocessing retrieval api_gateway

      - name: Seed and assert the contract
        env:
          IR_LIGHT_IMAGE: ir-light:ci
          IR_NLP_IMAGE: ir-nlp:ci
          IR_ML_IMAGE: ir-ml:ci
        run: |
          docker compose -f docker-compose.ci.yml run --rm seed
          docker compose -f docker-compose.ci.yml run --rm tests

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color --tail 120

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # Unit tests only cover code that runs; this gate covers the mistakes that never
  # reach them: an undefined name in a branch a test does not take, an import nobody
  # uses, a variable computed and dropped. Rules are limited to pyflakes (F) in
  # ruff.toml, so nothing here argues about formatting. Takes seconds — no images.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.5

      - name: Ruff (pyflakes rules)
        run: ruff check .
