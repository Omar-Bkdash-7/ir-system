# =============================================================================
# Docker Compose - Production Configuration
# =============================================================================
#
# USAGE
# -----
# Dev mode:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# Prod mode: docker-compose up (not yet implemented; this file is base + dev override)
# Tools:     docker-compose --profile tools up
#
# IMAGE SHARING STRATEGY
# ----------------------
# Services that share a tier use the exact same image (pulled from local tag), not
# separate builds. This eliminates duplicate layers and dangling images on rebuild:
#
#   ir-light:latest        → api_gateway, ranking
#   ir-nlp:latest          → preprocessing
#   ir-ml:latest           → indexing, retrieval, query_refinement, evaluation
#   ir-clustering:latest   → clustering
#   ir-rag:latest          → rag
#   ir-frontend:latest     → frontend
#
# Build configuration is defined ONCE per tier using x-build-* anchors. Services
# reference the anchor with "build: *build-light" and the shared image with
# "image: ir-light:latest". docker-compose pulls from the local tag; if missing,
# it builds from the anchor.
#
# WHY THIS MATTERS: Before this restructure, every service had a unique image tag
# (ir-api-gateway:latest, ir-indexing:latest, etc.), so adding a library rebuilt
# all 8 services and left 8 dangling images. Now, adding a library rebuilds only
# the affected tier, and services in that tier share the single rebuilt image.
#
# HEALTHCHECKS
# ------------
# Healthchecks are defined in compose (not Dockerfile) because shared images can't
# have per-service healthcheck commands baked in. All app services use curl to hit
# their /health endpoint; postgres uses pg_isready; redis uses redis-cli ping.
#
# DEV VS PROD DIFFERENCES (applied by docker-compose.dev.yml override)
# --------------------------------------------------------------------
# Dev:  - Bind mounts replace named volumes (./services, ./common, ./configs, ./data)
#       - Commands add --reload for FastAPI and --server.runOnSave for Streamlit
#       - ENVIRONMENT=development
#       - Build targets may differ (e.g., adding dev tools in future)
#
# Prod: - Named volumes for code isolation (not yet implemented)
#       - No --reload flags (performance)
#       - ENVIRONMENT=production
#
# PORTS
# -----
# Services expose ports on host for direct access during dev. Prod may use only
# internal networking with gateway as the sole exposed port.
#
#   8000: api_gateway       8004: ranking            8501: frontend
#   8001: preprocessing     8005: query_refinement   5432: postgres
#   8002: indexing          8006: evaluation         6379: redis
#   8003: retrieval         8007: clustering
#   8008: rag
#
# VOLUME NAMES
# ------------
# All volumes use ir_* prefix. NEVER rename ir_postgres_data (data loss). Other
# volumes are safe to recreate (indices, models, datasets are fetched on first run).
#
# =============================================================================

# =============================================================================
# Networks - Isolated network segments for security
# =============================================================================
networks:
  frontend_net:
    driver: bridge
    name: ir_frontend_network
  backend_net:
    driver: bridge
    name: ir_backend_network
  database_net:
    driver: bridge
    name: ir_database_network

# =============================================================================
# Volumes - Persistent and temporary data storage
# =============================================================================
volumes:
  # Database
  postgres_data:
    name: ir_postgres_data
  
  # Cache
  redis_data:
    name: ir_redis_data
  
  # Persistent application data
  datasets:
    name: ir_datasets
  indices:
    name: ir_indices
  cache:
    name: ir_cache
  models:
    name: ir_models
  processed_data:
    name: ir_processed_data
  evaluation_results:
    name: ir_evaluation_results
  metadata:
    name: ir_metadata
  clusters:
    name: ir_clusters
  rag_models:
    name: ir_rag_models
  
  # Logs
  logs:
    name: ir_logs

# =============================================================================
# Common Configuration Templates
# =============================================================================

# Build configurations for unified.Dockerfile targets
x-build-light: &build-light
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-light
  cache_from:
    - ir-light:latest

x-build-nlp: &build-nlp
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-nlp
  cache_from:
    - ir-nlp:latest

x-build-ml: &build-ml
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-ml
  cache_from:
    - ir-ml:latest

x-build-clustering: &build-clustering
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-clustering
  cache_from:
    - ir-clustering:latest

x-build-rag: &build-rag
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-rag
  cache_from:
    - ir-rag:latest

x-build-frontend: &build-frontend
  context: .
  dockerfile: docker/unified.Dockerfile
  target: runtime-frontend
  cache_from:
    - ir-frontend:latest

x-common-environment: &common-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ir_user}:${POSTGRES_PASSWORD:-ir_pass}@postgres:5432/${POSTGRES_DB:-ir_db}
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me_in_production}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me_in_production}
  CACHE_TTL: ${CACHE_TTL:-3600}
  IR_DATASETS_HOME: /app/data/datasets/.ir_datasets
  SENTENCE_TRANSFORMERS_HOME: /app/data/models
  TORCH_HOME: /app/data/cache/torch
  TRANSFORMERS_CACHE: /app/data/cache/transformers
  TORCH_DEVICE: cpu
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-common-service: &common-service
  restart: on-failure
  networks:
    - backend_net
  volumes:
    - logs:/app/logs
    - datasets:/app/data/datasets
    - indices:/app/data/indices
    - cache:/app/data/cache
    - models:/app/data/models
    - processed_data:/app/data/processed
    - evaluation_results:/app/data/evaluation
    - metadata:/app/data/metadata
    - clusters:/app/data/clusters
  environment:
    <<: *common-env
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Database Layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ir_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ir_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ir_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ir_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_net
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ir_user} -d ${POSTGRES_DB:-ir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis - Caching Layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ir_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_change_me_in_production}
      --bind 0.0.0.0
      --protected-mode yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_change_me_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # API Gateway - Entry point for all requests
  # ---------------------------------------------------------------------------
  api_gateway:
    <<: *common-service
    build: *build-light
    image: ir-light:latest
    container_name: ir_api_gateway
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      preprocessing:
        condition: service_started
      indexing:
        condition: service_started
      retrieval:
        condition: service_started
      ranking:
        condition: service_started
      query_refinement:
        condition: service_started
      evaluation:
        condition: service_started
      clustering:
        condition: service_started
      rag:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 10s
    environment:
      <<: *common-env
      SERVICE_NAME: api_gateway
      SERVICE_VERSION: "1.0.0"
      PREPROCESSING_URL: http://preprocessing:8001
      INDEXING_URL: http://indexing:8002
      RETRIEVAL_URL: http://retrieval:8003
      RANKING_URL: http://ranking:8004
      QUERY_REFINEMENT_URL: http://query_refinement:8005
      EVALUATION_URL: http://evaluation:8006
      CLUSTERING_URL: http://clustering:8007
      RAG_URL: http://rag:8008
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Preprocessing Service - NLP preprocessing
  # ---------------------------------------------------------------------------
  preprocessing:
    <<: *common-service
    build: *build-nlp
    image: ir-nlp:latest
    container_name: ir_preprocessing
    command: python -m uvicorn services.preprocessing.api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${PREPROCESSING_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: preprocessing
      SERVICE_VERSION: "1.0.0"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Indexing Service - Build and manage indices
  # ---------------------------------------------------------------------------
  indexing:
    <<: *common-service
    build: *build-ml
    image: ir-ml:latest
    container_name: ir_indexing
    command: python -m uvicorn services.indexing.main:app --host 0.0.0.0 --port 8002
    ports:
      - "${INDEXING_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      preprocessing:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: indexing
      SERVICE_VERSION: "1.0.0"
      PREPROCESSING_URL: http://preprocessing:8001
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Retrieval Service - Document retrieval
  # ---------------------------------------------------------------------------
  retrieval:
    <<: *common-service
    build: *build-ml
    image: ir-ml:latest
    container_name: ir_retrieval
    # One process by default. Each extra process loads its own copy of the indices, so raise
    # RETRIEVAL_UVICORN_WORKERS only with memory to spare (see the memory limit below).
    command: python -m uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8003 --workers ${RETRIEVAL_UVICORN_WORKERS:-1}
    ports:
      - "${RETRIEVAL_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      indexing:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: retrieval
      SERVICE_VERSION: "1.0.0"
      INDEXING_URL: http://indexing:8002
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Ranking Service - Result ranking and scoring
  # ---------------------------------------------------------------------------
  ranking:
    <<: *common-service
    build: *build-light
    image: ir-light:latest
    container_name: ir_ranking
    command: python -m uvicorn services.ranking.main:app --host 0.0.0.0 --port 8004
    ports:
      - "${RANKING_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: ranking
      SERVICE_VERSION: "1.0.0"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Query Refinement Service - Query enhancement
  # ---------------------------------------------------------------------------
  query_refinement:
    <<: *common-service
    build: *build-ml
    image: ir-ml:latest
    container_name: ir_query_refinement
    command: python -m uvicorn services.query_refinement.main:app --host 0.0.0.0 --port 8005
    ports:
      - "${QUERY_REFINEMENT_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: query_refinement
      SERVICE_VERSION: "1.0.0"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Evaluation Service - Performance metrics
  # ---------------------------------------------------------------------------
  evaluation:
    <<: *common-service
    build: *build-ml
    image: ir-ml:latest
    container_name: ir_evaluation
    command: python -m uvicorn services.evaluation.main:app --host 0.0.0.0 --port 8006
    ports:
      - "${EVALUATION_PORT:-8006}:8006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: evaluation
      SERVICE_VERSION: "1.0.0"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Clustering Service - Document clustering and topic detection
  # ---------------------------------------------------------------------------
  clustering:
    <<: *common-service
    build: *build-clustering
    image: ir-clustering:latest
    container_name: ir_clustering
    command: python -m uvicorn services.clustering.main:app --host 0.0.0.0 --port 8007
    ports:
      - "${CLUSTERING_PORT:-8007}:8007"
    depends_on:
      postgres:
        condition: service_healthy
      indexing:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
    environment:
      <<: *common-env
      SERVICE_NAME: clustering
      SERVICE_VERSION: "1.0.0"
      INDEXING_URL: http://indexing:8002
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # RAG Service - Retrieval-Augmented Generation
  # ---------------------------------------------------------------------------
  rag:
    <<: *common-service
    build: *build-rag
    image: ir-rag:latest
    container_name: ir_rag
    command: python -m uvicorn services.rag.main:app --host 0.0.0.0 --port 8008
    init: true
    ports:
      - "${RAG_PORT:-8008}:8008"
    depends_on:
      retrieval:
        condition: service_started
    volumes:
      - logs:/app/logs
      - datasets:/app/data/datasets
      - indices:/app/data/indices
      - cache:/app/data/cache
      - models:/app/data/models
      - processed_data:/app/data/processed
      - evaluation_results:/app/data/evaluation
      - metadata:/app/data/metadata
      - clusters:/app/data/clusters
      - rag_models:/models
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      start_period: 60s
    stop_grace_period: 20s
    environment:
      <<: *common-env
      SERVICE_NAME: rag
      SERVICE_VERSION: "2.0.0"
      RETRIEVAL_URL: http://retrieval:8003
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      RAG_REMOTE_BASE_URL: ${RAG_REMOTE_BASE_URL:-https://router.huggingface.co/v1}
      RAG_REMOTE_MODEL: ${RAG_REMOTE_MODEL:-meta-llama/Llama-3.1-8B-Instruct:cheapest}
      RAG_DEFAULT_MODE: ${RAG_DEFAULT_MODE:-auto}
      RAG_LOCAL_MODEL: ${RAG_LOCAL_MODEL:-qwen2.5-0.5b-instruct}
      RAG_LOCAL_ENABLED: ${RAG_LOCAL_ENABLED:-true}
      RAG_MODELS_DIR: /models/rag
      RAG_LOCAL_THREADS: ${RAG_LOCAL_THREADS:-2}
      RAG_LOCAL_DTYPE: ${RAG_LOCAL_DTYPE:-float32}
      HF_HOME: /models/hf-home
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Frontend - Streamlit Web UI
  # ---------------------------------------------------------------------------
  frontend:
    <<: *common-service
    build: *build-frontend
    image: ir-frontend:latest
    container_name: ir_frontend
    command: streamlit run frontend/app.py
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      api_gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      start_period: 20s
    environment:
      <<: *common-env
      SERVICE_NAME: frontend
      SERVICE_VERSION: "1.0.0"
      API_GATEWAY_URL: http://api_gateway:8000
      INDEXING_URL: http://indexing:8002
      RETRIEVAL_URL: http://retrieval:8003
      RANKING_URL: http://ranking:8004
      QUERY_REFINEMENT_URL: http://query_refinement:8005
      EVALUATION_URL: http://evaluation:8006
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

