x-common: &common
  build: .
  working_dir: /app
  volumes:
    - .:/app
  environment:
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - IR_DATASETS_HOME=/app/data/.ir_datasets
    - DATABASE_URL=postgresql://ir_user:ir_pass@postgres:5432/ir_db
  restart: on-failure
  depends_on:
    - postgres

services:

  postgres:
    image: postgres:15-alpine
    container_name: ir_postgres
    environment:
      POSTGRES_USER: ir_user
      POSTGRES_PASSWORD: ir_pass
      POSTGRES_DB: ir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api_gateway:
    <<: *common
    container_name: ir_api_gateway
    command: uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - preprocessing
      - retrieval
      - ranking
      - query_refinement
      - evaluation

  preprocessing:
    <<: *common
    container_name: ir_preprocessing
    command: uvicorn services.preprocessing.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"

  indexing:
    <<: *common
    container_name: ir_indexing
    command: uvicorn services.indexing.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    depends_on:
      - preprocessing

  retrieval:
    <<: *common
    container_name: ir_retrieval
    command: uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    depends_on:
      - indexing

  ranking:
    <<: *common
    container_name: ir_ranking
    command: uvicorn services.ranking.main:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"

  query_refinement:
    <<: *common
    container_name: ir_query_refinement
    command: uvicorn services.query_refinement.main:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"

  evaluation:
    <<: *common
    container_name: ir_evaluation
    command: uvicorn services.evaluation.main:app --host 0.0.0.0 --port 8006 --reload
    ports:
      - "8006:8006"

  frontend:
    <<: *common
    container_name: ir_frontend
    command: streamlit run frontend/app.py
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - API_GATEWAY_URL=http://api_gateway:8000
      - INDEXING_URL=http://indexing:8002
      - RETRIEVAL_URL=http://retrieval:8003
      - RANKING_URL=http://ranking:8004
      - QUERY_REFINEMENT_URL=http://query_refinement:8005
      - EVALUATION_URL=http://evaluation:8006
    depends_on:
      - api_gateway

  build_indices:
    <<: *common
    container_name: ir_build_indices
    profiles:
      - tools
    command: python scripts/build_indices.py

volumes:
  postgres_data:
