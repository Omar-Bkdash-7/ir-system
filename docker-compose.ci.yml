# =============================================================================
# Docker Compose - Contract test stack (CI and local)
# =============================================================================
# The smallest stack that can prove the services still agree with each other:
# postgres -> preprocessing -> retrieval -> api_gateway, plus a seeder and the
# test runner. No host ports are published, so it can run next to a dev stack.
#
#   docker compose -f docker-compose.ci.yml up -d --wait postgres preprocessing retrieval api_gateway
#   docker compose -f docker-compose.ci.yml run --rm seed
#   docker compose -f docker-compose.ci.yml run --rm tests
#   docker compose -f docker-compose.ci.yml down -v
#
# Images default to the locally built tags; CI overrides them with its own.
# One volume holds every data directory the indexers and the gateway share.
# =============================================================================

name: ir-contract

x-common-env: &common-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: ci
  DATABASE_URL: postgresql://ir_ci:ir_ci@postgres:5432/ir_ci
  IR_DATASETS_HOME: /app/data/datasets/.ir_datasets
  SENTENCE_TRANSFORMERS_HOME: /app/data/models
  CUDA_VISIBLE_DEVICES: "-1"
  LOG_LEVEL: INFO

volumes:
  data:

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ir_ci
      POSTGRES_PASSWORD: ir_ci
      POSTGRES_DB: ir_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir_ci -d ir_ci"]
      interval: 5s
      timeout: 5s
      retries: 20

  preprocessing:
    image: ${IR_NLP_IMAGE:-ir-nlp:latest}
    command: python -m uvicorn services.preprocessing.api.main:app --host 0.0.0.0 --port 8001
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      # spaCy and the NLTK corpora are loaded in the lifespan hook, before uvicorn
      # accepts connections; a cold CI runner needs more room than a warm laptop.
      start_period: 60s

  retrieval:
    image: ${IR_ML_IMAGE:-ir-ml:latest}
    command: python -m uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8003
    environment: *common-env
    volumes:
      - data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  api_gateway:
    image: ${IR_LIGHT_IMAGE:-ir-light:latest}
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *common-env
      PREPROCESSING_URL: http://preprocessing:8001
      RETRIEVAL_URL: http://retrieval:8003
      GATEWAY_METADATA_DIR: /app/data/metadata
      RATE_LIMIT: "1000"  # the contract test fires a burst on purpose
    volumes:
      - data:/app/data:ro
    depends_on:
      retrieval:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: writes the dataset into PostgreSQL, builds its indices and its metadata.
  seed:
    image: ${IR_ML_IMAGE:-ir-ml:latest}
    command: python scripts/ci_seed.py
    environment: *common-env
    volumes:
      - data:/app/data
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: the contract assertions themselves.
  tests:
    image: ${IR_LIGHT_IMAGE:-ir-light:latest}
    # pytest ships in requirements/10-dev.txt, which every image installs, so the run
    # needs neither root nor a network round trip to PyPI.
    command: python -m pytest tests/integration -q
    environment:
      <<: *common-env
      GATEWAY_URL: http://api_gateway:8000
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      api_gateway:
        condition: service_healthy
