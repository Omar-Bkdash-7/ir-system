  # ---------------------------------------------------------------------------
  # Tool: Build Embedding Index
  # ---------------------------------------------------------------------------
  build_embeddings:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    image: ir-tools:latest
    container_name: ir_build_embeddings
    profiles:
