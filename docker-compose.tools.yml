# =============================================================================
# Docker Compose - Tools and Scripts
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.tools.yml run <tool>
# =============================================================================

version: '3.9'

services:

  # ---------------------------------------------------------------------------
  # Tool: Initialize Database Schema
  # ---------------------------------------------------------------------------
  init_db:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: ir-db-tools:latest
    container_name: ir_init_db
    profiles:
      - tools
    command: python scripts/init_db.py
    volumes:
      - logs:/app/logs
    networks:
      - backend_net
      - database_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ir_user}:${POSTGRES_PASSWORD:-ir_pass}@postgres:5432/${POSTGRES_DB:-ir_db}
      LOG_LEVEL: INFO
      SERVICE_NAME: init_db

  # ---------------------------------------------------------------------------
  # Tool: Check Data Status
  # ---------------------------------------------------------------------------
  check_data:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: ir-db-tools:latest
    container_name: ir_check_data
    profiles:
      - tools
    command: python scripts/check_data.py
    volumes:
      - datasets:/app/data/datasets
      - processed_data:/app/data/processed
      - indices:/app/data/indices
      - models:/app/data/models
      - cache:/app/data/cache
      - evaluation_results:/app/data/evaluation
      - logs:/app/logs
    networks:
      - backend_net
      - database_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ir_user}:${POSTGRES_PASSWORD:-ir_pass}@postgres:5432/${POSTGRES_DB:-ir_db}
      LOG_LEVEL: INFO
      SERVICE_NAME: check_data

  # ---------------------------------------------------------------------------
  # Tool: Refresh Materialized Views
  # ---------------------------------------------------------------------------
  refresh_views:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: ir-db-tools:latest
    container_name: ir_refresh_views
    profiles:
      - tools
    command: python scripts/refresh_views.py
    volumes:
      - logs:/app/logs
    networks:
      - backend_net
      - database_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ir_user}:${POSTGRES_PASSWORD:-ir_pass}@postgres:5432/${POSTGRES_DB:-ir_db}
      LOG_LEVEL: INFO
      SERVICE_NAME: refresh_views

  # ---------------------------------------------------------------------------
  # Tool: Clear Cache
  # ---------------------------------------------------------------------------
  clear_cache:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: ir-db-tools:latest
    container_name: ir_clear_cache
    profiles:
      - tools
    command: python scripts/clear_cache.py --all
    volumes:
      - logs:/app/logs
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SERVICE_NAME: clear_cache

  # ---------------------------------------------------------------------------
  # Tool: Cache Stats
  # ---------------------------------------------------------------------------
  cache_stats:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: ir-db-tools:latest
    container_name: ir_cache_stats
    profiles:
      - tools
    command: python scripts/clear_cache.py --stats
    volumes:
      - logs:/app/logs
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SERVICE_NAME: cache_stats

  # ---------------------------------------------------------------------------
  # Tool: Download Dataset
  # ---------------------------------------------------------------------------
  download_dataset:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    image: ir-tools:latest
    container_name: ir_download_dataset
    profiles:
      - tools
    command: python scripts/download_dataset.py
    volumes:
      - datasets:/app/data/datasets
      - logs:/app/logs
    networks:
      - backend_net
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      IR_DATASETS_HOME: /app/data/datasets
      LOG_LEVEL: INFO
      SERVICE_NAME: download_dataset

  # ---------------------------------------------------------------------------
  # Tool: Preprocess Dataset
  # ---------------------------------------------------------------------------
  preprocess_dataset:
    build:
      context: .
      dockerfile: docker/service-nlp.Dockerfile
    image: ir-preprocessing-tools:latest
    container_name: ir_preprocess_dataset
    profiles:
      - tools
    command: python scripts/preprocess_dataset.py
    volumes:
      - datasets:/app/data/datasets
      - processed_data:/app/data/processed
      - logs:/app/logs
    networks:
      - backend_net
      - database_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      IR_DATASETS_HOME: /app/data/datasets
      DATABASE_URL: postgresql://${POSTGRES_USER:-ir_user}:${POSTGRES_PASSWORD:-ir_pass}@postgres:5432/${POSTGRES_DB:-ir_db}
      LOG_LEVEL: INFO
      SERVICE_NAME: preprocess_dataset

  # ---------------------------------------------------------------------------
  # Tool: Load Documents to Database
  # ---------------------------------------------------------------------------
  load_to_db:
