dataset:
  name: "beir/quora"
  ir_datasets_id: "beir/quora"
  test_split: "beir/quora/test"
  expected_docs_count: 522931
  min_docs_threshold: 200000
  min_queries_threshold: 1000
  min_qrels_threshold: 1000
  validation_retries: 3
  validation_retry_delay: 10

database:
  host: "postgres"
  port: 5432
  user: "ir_user"
  password: "ir_pass"
  database: "ir_db"
  table: "documents"

paths:
  data_root: "data"
  raw: "data/raw"
  processed: "data/processed"
  indices: "data/indices"
  logs: "logs"
  metadata: "data/metadata.json"
  raw_docs: "data/raw/quora_docs.jsonl"
  processed_docs: "data/processed/quora_preprocessed.jsonl"

indices:
  inverted_index: "data/indices/bm25_index.pkl"
  tfidf_vectorizer: "data/indices/tfidf_vectorizer.pkl"
  tfidf_matrix: "data/indices/tfidf_matrix.npz"
  tfidf_doc_ids: "data/indices/tfidf_doc_ids.json"
  embeddings: "data/indices/embeddings.npy"
  doc_id_map: "data/indices/doc_id_map.json"

models:
  embedding:
    model_name: "all-MiniLM-L6-v2"
    dimension: 384
    batch_size: 64
    normalize: true
  bm25:
    default_k1: 1.5
    default_b: 0.75
  tfidf:
    sublinear_tf: true
    norm: "l2"
  rag:
    model_name: "google/flan-t5-base"
    max_new_tokens: 150
    num_beams: 4
    max_input_length: 1024
    max_docs_for_context: 5
    doc_truncate_tokens: 300

retrieval:
  candidates_k: 1000
  top_k: 50
  top_k_display: 20

query_refinement:
  max_synonyms_per_word: 2
  max_wordnet_synsets: 3
  history_lookback: 5
  history_top_terms: 2

services:
  api_gateway:
    host: "0.0.0.0"
    port: 8000
  preprocessing:
    host: "0.0.0.0"
    port: 8001
  indexing:
    host: "0.0.0.0"
    port: 8002
  retrieval:
    host: "0.0.0.0"
    port: 8003
  ranking:
    host: "0.0.0.0"
    port: 8004
  query_refinement:
    host: "0.0.0.0"
    port: 8005
  evaluation:
    host: "0.0.0.0"
    port: 8006
  frontend:
    host: "0.0.0.0"
    port: 3000

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_prefix: "logs"
