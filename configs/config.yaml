dataset:
  # Validation thresholds (applied to all datasets)
  min_docs_threshold: 1000
  min_queries_threshold: 50
  min_qrels_threshold: 50
  validation_retries: 3
  validation_retry_delay: 10

database:
  host: "postgres"
  port: 5432
  user: "ir_user"
  password: "ir_pass"
  database: "ir_db"
  table: "documents"

paths:
  data_root: "data"
  raw: "data/raw"
  processed: "data/processed"
  indices: "data/indices"
  logs: "logs"
  metadata_dir: "data/metadata"
  
  # Legacy paths (kept for backward compatibility)
  raw_docs: "data/raw/{dataset}_docs.jsonl"
  processed_docs: "data/processed/{dataset}_preprocessed.jsonl"

indices:
  base_dir: "data/indices"
  # Multi-dataset support: {dataset} will be replaced with dataset slug (e.g., beir-quora)
  bm25_index: "data/indices/{dataset}/bm25_index.pkl"
  inverted_index: "data/indices/{dataset}/bm25_index.pkl"
  tfidf_vectorizer: "data/indices/{dataset}/tfidf_vectorizer.pkl"
  tfidf_matrix: "data/indices/{dataset}/tfidf_matrix.npz"
  tfidf_doc_ids: "data/indices/{dataset}/tfidf_doc_ids.json"
  embeddings: "data/indices/{dataset}/embeddings.npy"
  doc_id_map: "data/indices/{dataset}/doc_id_map.json"

models:
  embedding:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    local_path: "data/models/all-MiniLM-L6-v2"
    dimension: 384
    batch_size: 64
    normalize: true
    trust_remote_code: false
  bm25:
    default_k1: 1.5
    default_b: 0.75
  tfidf:
    sublinear_tf: true
    norm: "l2"
  rag:
    model_name: "google/flan-t5-base"
    max_new_tokens: 150
    num_beams: 4
    max_input_length: 1024
    max_docs_for_context: 5
    doc_truncate_tokens: 300

retrieval:
  candidates_k: 1000
  top_k: 50
  top_k_display: 20

query_refinement:
  max_synonyms_per_word: 2
  max_wordnet_synsets: 2
  max_history_length: 10
  similarity_threshold: 0.35
  max_edit_distance: 2
  min_term_length: 4
  confidence_threshold: 0.7

services:
  api_gateway:
    host: "0.0.0.0"
    port: 8000
  preprocessing:
    host: "0.0.0.0"
    port: 8001
  indexing:
    host: "0.0.0.0"
    port: 8002
  retrieval:
    host: "0.0.0.0"
    port: 8003
  ranking:
    host: "0.0.0.0"
    port: 8004
  query_refinement:
    host: "0.0.0.0"
    port: 8005
  evaluation:
    host: "0.0.0.0"
    port: 8006
  frontend:
    host: "0.0.0.0"
    port: 3000
  preprocessing_url: "http://preprocessing:8001"
  retrieval_url: "http://retrieval:8003"
  ranking_url: "http://ranking:8004"
  query_refinement_url: "http://query_refinement:8005"
  evaluation_url: "http://evaluation:8006"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_prefix: "logs"
