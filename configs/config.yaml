dataset:
  # Validation thresholds (applied to all datasets)
  min_docs_threshold: 1000
  min_queries_threshold: 50
  min_qrels_threshold: 50
  validation_retries: 3
  validation_retry_delay: 10

database:
  host: "postgres"
  port: 5432
  user: "ir_user"
  password: "ir_pass"
  database: "ir_db"
  table: "documents"

paths:
  data_root: "data"
  raw: "data/raw"
  processed: "data/processed"
  indices: "data/indices"
  logs: "logs"
  metadata_dir: "data/metadata"
  
  # Legacy paths (kept for backward compatibility)
  raw_docs: "data/raw/{dataset}_docs.jsonl"
  processed_docs: "data/processed/{dataset}_preprocessed.jsonl"

indices:
  base_dir: "data/indices"
  # Multi-dataset support: {dataset} will be replaced with dataset slug (e.g., beir_quora)
  bm25_index: "data/indices/{dataset}/bm25/bm25_index.pkl"
  inverted_index: "data/indices/{dataset}/bm25/bm25_index.pkl"
  tfidf_vectorizer: "data/indices/{dataset}/tfidf/tfidf_vectorizer.pkl"
  tfidf_matrix: "data/indices/{dataset}/tfidf/tfidf_matrix.npz"
  tfidf_doc_ids: "data/indices/{dataset}/tfidf/tfidf_doc_ids.json"
  embeddings: "data/indices/{dataset}/embedding/embeddings.npy"
  doc_id_map: "data/indices/{dataset}/embedding/doc_id_map.json"

models:
  embedding:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    local_path: "data/models/all-MiniLM-L6-v2"
    dimension: 384
    batch_size: 64
    normalize: true
    trust_remote_code: false
  bm25:
    default_k1: 1.5
    default_b: 0.75
  tfidf:
    sublinear_tf: true
    norm: "l2"
  rag:
    model_name: "google/flan-t5-base"
    max_new_tokens: 150
    num_beams: 4
    max_input_length: 1024
    max_docs_for_context: 5
    doc_truncate_tokens: 300

retrieval:
  candidates_k: 1000
  top_k: 50
  top_k_display: 20

query_refinement:
  max_synonyms_per_word: 2
  max_wordnet_synsets: 2
  similarity_threshold: 0.35
  max_edit_distance: 2
  min_term_length: 4
  confidence_threshold: 0.7
  # A replacement word needs this many dictionary occurrences; it rejects "ceroplastic" for aeroelastic (50) while
  # keeping "boundary" for boundray (3252).
  min_correction_frequency: 1000
  max_query_words_for_expansion: 4
  # A synonym needs at least this many SemCor occurrences. At 2, boundary keeps "edge" but drops "bound" and layer
  # drops "bed": appending a word retrieval will run verbatim needs some evidence behind it.
  min_synonym_count: 2
  max_history_terms: 3
  history_boost_weight: 0.15
  max_semantic_drift: 0.25
  # Images ship their NLTK corpora; downloading at request time only happens when this is enabled.
  allow_nltk_download: false

clustering:
  # HDBSCAN + topic detection. Every key is optional; services/clustering/config.py holds the same defaults.
  data_dir: "data/clusters"
  indices_dir: "data/indices"
  min_cluster_size: 5
  min_samples: 3
  metric: "euclidean"
  n_keywords: 10
  representative_docs: 3
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: "cosine"
  random_state: 42
  text_batch_size: 1000
  # Above this share of documents without text, topics are skipped instead of being built from placeholders.
  max_missing_text_ratio: 0.05
  db_pool_max: 4

services:
  api_gateway:
    host: "0.0.0.0"
    port: 8000
  preprocessing:
    host: "0.0.0.0"
    port: 8001
  indexing:
    host: "0.0.0.0"
    port: 8002
  retrieval:
    host: "0.0.0.0"
    port: 8003
  ranking:
    host: "0.0.0.0"
    port: 8004
  query_refinement:
    host: "0.0.0.0"
    port: 8005
  evaluation:
    host: "0.0.0.0"
    port: 8006
  frontend:
    host: "0.0.0.0"
    port: 3000
  preprocessing_url: "http://preprocessing:8001"
  retrieval_url: "http://retrieval:8003"
  ranking_url: "http://ranking:8004"
  query_refinement_url: "http://query_refinement:8005"
  evaluation_url: "http://evaluation:8006"
  clustering_url: "http://clustering:8007"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_prefix: "logs"
